<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil Sharma - Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --glow-color-1: hsl(30, 100%, 50%);
            --glow-color-2: hsl(45, 100%, 50%);
            --glow-color-3: hsl(0, 100%, 60%);
            --glow-color-4: hsl(15, 100%, 50%);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0500;
            color: #e5e7eb;
            overflow-x: hidden;
            position: relative;
        }
        .bg-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(249, 115, 22, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(249, 115, 22, 0.05) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }
        .portfolio-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }
        @media (min-width: 768px) {
            .portfolio-grid { grid-template-columns: repeat(12, 1fr); grid-auto-rows: 150px; }
        }
        @media (min-width: 1024px) {
            .portfolio-grid { grid-auto-rows: 180px; }
        }
        @media (min-width: 1280px) {
            .portfolio-grid { grid-auto-rows: 220px; }
        }

        .aurora-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100vh;
            overflow: hidden; z-index: -2; pointer-events: none;
        }
        .aurora-shape {
            position: absolute; border-radius: 50%;
            filter: blur(100px); opacity: 0.5; will-change: transform;
        }
        .shape1 { width: 400px; height: 400px; background-color: var(--glow-color-1); top: 10%; left: 10%; }
        .shape2 { width: 300px; height: 300px; background-color: var(--glow-color-2); top: 60%; left: 80%; }
        .shape3 { width: 500px; height: 500px; background-color: var(--glow-color-3); top: 50%; left: 30%; }
        .shape4 { width: 350px; height: 350px; background-color: var(--glow-color-4); top: 20%; left: 70%; }
        .glass-card {
            background: rgba(20, 10, 5, 0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 200, 150, 0.08);
            /* Only transition visual props — never transform — prevents iframe glitch on cursor enter/exit */
            transition: box-shadow 0.2s ease-out, border-color 0.2s ease-out;
            position: relative; overflow: hidden;
            border-radius: 1rem; transform-style: preserve-3d;
        }
        .glass-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(400px circle at var(--x, 50%) var(--y, 50%), rgba(245, 158, 11, 0.2), transparent 40%);
            opacity: 0; transition: opacity 0.5s; pointer-events: none; z-index: 1;
        }
        .glass-card:hover { box-shadow: 0 20px 40px rgba(0,0,0,0.5); border-color: rgba(251,146,60,0.4); }
        .glass-card:hover::before { opacity: 1; }
        /* When a video is playing — kill every animation, glow, and 3D context on the card */
        .glass-card.no-animate,
        .glass-card.no-animate:hover {
            box-shadow: none !important;
            border-color: rgba(255,200,150,0.08) !important;
            transition: none !important;
            transform: none !important;
            transform-style: flat !important;
            will-change: auto !important;
        }
        .glass-card.no-animate::before,
        .glass-card.no-animate:hover::before { opacity: 0 !important; transition: none !important; }
        .gradient-text {
            background-image: linear-gradient(90deg, #fbbf24, #f97316, #ef4444);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            background-size: 200% auto; animation: gradient-flow 5s linear infinite;
        }
        @keyframes gradient-flow { to { background-position: 200% center; } }
        .gradient-btn {
            position: relative; overflow: hidden;
            background-image: linear-gradient(to right, #ea580c, #d97706, #b91c1c);
            background-size: 200% auto; transition: all 0.4s ease-in-out;
            box-shadow: 0 4px 15px 0 rgba(249, 115, 22, 0.4);
            border: none; cursor: pointer;
        }
        .gradient-btn::before {
            content: ''; position: absolute; top: 0; left: -150%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 80%);
            transform: skewX(-25deg); transition: left 0.8s ease-in-out;
        }
        .gradient-btn:hover { background-position: right center; transform: scale(1.05); box-shadow: 0 8px 30px 0 rgba(249,115,22,0.6); }
        .gradient-btn:hover::before { left: 150%; }
        .particle {
            position: absolute; background-color: #fff7ed; border-radius: 50%;
            animation: fly 0.9s ease-out forwards; pointer-events: none; z-index: 50;
        }
        @keyframes fly {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(0) translate(var(--x), var(--y)); opacity: 0; }
        }
        .animate-on-scroll {
            opacity: 0; transform: translateY(30px) scale(0.98);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        .animate-on-scroll.is-visible { opacity: 1; transform: translateY(0) scale(1); }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #ea580c, #b91c1c); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(to bottom, #f97316, #dc2626); }
        .modal-overlay { animation: fadeIn 0.2s ease-out forwards; }
        .modal-content { animation: scaleUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const IconBase = ({ size = 24, className = "", children, fill = "none" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Play = (props) => <IconBase {...props}><polygon points="5 3 19 12 5 21 5 3"></polygon></IconBase>;
        const Instagram = (props) => <IconBase {...props}><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></IconBase>;
        const Video = (props) => <IconBase {...props}><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></IconBase>;
        const Scissors = (props) => <IconBase {...props}><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></IconBase>;
        const Layers = (props) => <IconBase {...props}><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></IconBase>;
        const XIcon = (props) => <IconBase {...props}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></IconBase>;
        const Whatsapp = (props) => <IconBase {...props}><path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"></path></IconBase>;
        const MessageCircle = (props) => <IconBase {...props}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></IconBase>;
        const Mail = (props) => <IconBase {...props}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></IconBase>;

        const PORTFOLIO_DATA = {
          personal: {
            name: "Nikhil Sharma",
            title: "Video Editor",
            tagline: "Crafting narratives through Podcast Audio & Motion.",
            email: "nikhil.sharma.ns.014@gmail.com",
            whatsapp: "+919460922273",
            instagramId: "hinikhill",
            socials: {
              instagram: "https://www.instagram.com/hinikhill/",
              whatsapp: "https://wa.me/919460922273"
            },
            profileImage: "https://www.image2url.com/r2/default/images/1779528959356-2b4a8798-8e3a-4cec-a81b-3984615726ea.png",
            aboutText: "I am a visual storyteller specializing in high-retention editing. With 2+ years of experience, I bridge the gap between raw footage and polished, engaging content."
          },
          works: [
            {
              id: 's1', title: "Real Estate", category: "Shorts", format: "portrait",
              image: "assets/short 1.png",
              // FIX 1: Added ?embed to this URL (was missing in original)
              link: "https://www.canva.com/design/DAHJJ_1ppS4/WEWH-KonAx_-keaskNiOrg/watch",
              tags: ["Engaging", "Viral"]
            },
            {
              id: 'p1', title: "Engaging Trailer ", category: "Podcasts", format: "landscape", client: "Founder: Clarity",
              image: "https://www.image2url.com/r2/default/images/1778360250086-c397d7b3-1066-4360-85f3-dc5934885873.png",
              link: "https://www.canva.com/design/DAHJJx4kQOY/S9enudSa3OrNUuueg9vGTg/watch",
              tags: ["Trailer", "Multi-Cam"]
            },
            {
              id: 's2', title: "Engaging Reel", category: "Shorts", format: "portrait",
              image: "assets/short 2.png",
              link: "https://www.canva.com/design/DAHJJwcQ_lk/STiluNLa3fg8Vle5UooONQ/watch",
              tags: [" Typography"]
            },
            {
              id: 'm1', title: "Engaging Trailer", category: "Podcasts", format: "landscape",
              image: "assets/motion 0.png",
              link: "https://www.canva.com/design/DAHJJ2Kfqg8/1Wl8WHORQYsxtJc1cLoaHA/watch",
              tags: ["Cinematic", "After Effects"]
            },
            {
              id: 'p2', title: " Engaging Trailer", category: "Podcasts", format: "landscape", client: "Andrew",
              image: "https://www.image2url.com/r2/default/images/1778360131111-12e6f4ba-0190-4647-9edc-0f010503344a.png",
              link: "https://www.canva.com/design/DAHJJ2DijZY/SCS90RI0r8LPyjYS43OA4Q/watch",
              tags: ["Multi-cam"]
            },
            {
              id: 'm2', title: " Engaging crypto reel", category: "Motion", format: "portrait",
              image: "assets/motion 1.png",
              link: "https://www.canva.com/design/DAHJJ-Inqg0/l_KgaiqGO9HWFDuH7ZsOGw/watch",
              tags: [" Motion graphic"]
            },
            {
              id: 'm3', title: " Theme based", category: "Motion", format: "portrait",
              image: "assets/motion 2.png",
              link: "https://www.canva.com/design/DAHJJ5NU4-M/b0R4_x5WwUXXtcRYZZstNg/watch",
              tags: ["Seamless Transitions"]
            },
            {
              id: 's3', title: "Engaging Real Estate ", category: "Shorts", format: "portrait",
              image: "assets/short 3.png",
              link: "https://www.canva.com/design/DAHJJ8wJ5vU/rr-WnX9r08bKDtiVy63yBA/watch",
              tags: ["Pacing"]
            }
          ]
        };

        // FIX 1: getEmbedSrc now ensures ?embed is always present for Canva links
        const getEmbedSrc = (url) => {
            if (!url) return url;
            if (url.includes('?embed')) return url;          // already correct
            if (url.includes('?')) return url + '&embed';    // has other params
            return url + '?embed';                            // no params at all
        };

        const useParallax = () => {
          useEffect(() => {
            const parallaxElements = document.querySelectorAll('.aurora-shape');
            const handleScroll = () => {
              const scrollPosition = window.pageYOffset;
              requestAnimationFrame(() => {
                parallaxElements.forEach(el => {
                  const speed = parseFloat(el.dataset.speed) || 0.5;
                  el.style.transform = `translateY(${scrollPosition * speed}px)`;
                });
              });
            };
            window.addEventListener('scroll', handleScroll, { passive: true });
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);
        };

        const useOnScreen = () => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) entry.target.classList.add('is-visible');
                    });
                }, { threshold: 0.1 });
                document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);
        };

        const ContactModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center px-4 modal-overlay">
                    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative bg-[#1a1008] border border-orange-500/30 rounded-3xl p-8 w-full max-w-sm modal-content shadow-[0_0_50px_rgba(249,115,22,0.2)]">
                        <button onClick={onClose} className="absolute top-5 right-5 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-full p-2 transition-colors">
                            <XIcon size={20} />
                        </button>
                        <div className="text-center mb-8 mt-2">
                            <h3 className="text-3xl font-black text-white mb-2">Let's Connect</h3>
                            <p className="text-gray-400 text-sm">Choose your preferred way to reach out.</p>
                        </div>
                        <div className="space-y-4">
                            <a href={`mailto:${PORTFOLIO_DATA.personal.email}`}
                                className="flex items-center justify-center w-full gap-3 bg-gradient-to-r from-orange-600 to-red-600 text-white px-6 py-4 rounded-xl font-bold text-lg hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(249,115,22,0.3)] transition-all duration-300">
                                <Mail size={22} /> Email Me
                            </a>
                            <a href={PORTFOLIO_DATA.personal.socials.whatsapp} target="_blank" rel="noopener noreferrer"
                                className="flex items-center justify-center w-full gap-3 bg-[#25D366] text-white px-6 py-4 rounded-xl font-bold text-lg hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(37,211,102,0.3)] transition-all duration-300">
                                <Whatsapp size={22} /> WhatsApp
                            </a>
                            <a href={PORTFOLIO_DATA.personal.socials.instagram} target="_blank" rel="noopener noreferrer"
                                className="flex items-center justify-center w-full gap-3 bg-gradient-to-tr from-[#f09433] via-[#dc2743] to-[#bc1888] text-white px-6 py-4 rounded-xl font-bold text-lg hover:-translate-y-1 hover:shadow-[0_10px_20px_rgba(220,39,67,0.3)] transition-all duration-300">
                                <Instagram size={22} /> Instagram
                            </a>
                        </div>
                        <div className="mt-8 text-center border-t border-white/10 pt-6">
                            <p className="text-xs text-gray-500 tracking-wider uppercase">Available for freelance & contract work</p>
                        </div>
                    </div>
                </div>
            );
        };

        const GradientBtn = ({ children, className = "", onClick, ...props }) => {
            const btnRef = useRef(null);
            const createParticle = (x, y) => {
                const particle = document.createElement('span');
                particle.classList.add('particle');
                if (btnRef.current) btnRef.current.appendChild(particle);
                const size = Math.floor(Math.random() * 6 + 3);
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x - size / 2}px`;
                particle.style.top = `${y - size / 2}px`;
                const randomX = (Math.random() - 0.5) * 100;
                const randomY = (Math.random() - 0.5) * 100;
                particle.style.setProperty('--x', `${randomX}px`);
                particle.style.setProperty('--y', `${randomY}px`);
                particle.addEventListener('animationend', () => { particle.remove(); });
            };
            const handleMouseEnter = (e) => {
                const rect = e.target.getBoundingClientRect();
                for (let i = 0; i < 15; i++) createParticle(e.clientX - rect.left, e.clientY - rect.top);
            };
            return (
                <button ref={btnRef} className={`gradient-btn text-white font-semibold rounded-full shadow-lg ${className}`} onMouseEnter={handleMouseEnter} onClick={onClick} {...props}>{children}</button>
            );
        };

        /*
         * FIX 2: TiltCard now accepts a `disabled` prop.
         * When disabled=true (a video is actively playing inside this card),
         * ALL mousemove/mouseleave transform updates are skipped.
         * This prevents the browser from disturbing the iframe's GPU composite
         * layer, which was causing the video to restart on cursor exit.
         */
        const TiltCard = ({ children, className = "", disabled = false }) => {
          const cardRef = useRef(null);

          const handleMouseMove = (e) => {
            if (disabled || !cardRef.current) return;
            const card = cardRef.current;
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--x', `${x}px`);
            card.style.setProperty('--y', `${y}px`);
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const tiltStrength = 10;
            const rotateY = ((x - centerX) / centerX) * tiltStrength;
            const rotateX = -((y - centerY) / centerY) * tiltStrength;
            requestAnimationFrame(() => {
              if (cardRef.current) {
                cardRef.current.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02,1.02,1.02)`;
              }
            });
          };

          const handleMouseLeave = () => {
            if (disabled || !cardRef.current) return;
            requestAnimationFrame(() => {
              if (cardRef.current) {
                cardRef.current.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
              }
            });
          };

          // Whenever disabled flips on, immediately flatten the card so there's
          // no residual tilt while the video is playing.
          useEffect(() => {
            if (disabled && cardRef.current) {
              cardRef.current.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
            }
          }, [disabled]);

          return (
            <div className={`perspective-1000 h-full ${className}`}>
              <div ref={cardRef} className={`glass-card w-full h-full${disabled ? ' no-animate' : ''}`}
                onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}>
                {children}
              </div>
            </div>
          );
        };

        const Navbar = ({ onContactClick }) => {
          const [scrolled, setScrolled] = useState(false);
          useEffect(() => {
            const handleScroll = () => setScrolled(window.scrollY > 50);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);
          return (
            <nav className="fixed top-0 left-0 w-full z-50 transition-all duration-300 py-2.5">
              <div className="container mx-auto px-4">
                <div className={`glass-card !rounded-full px-4 py-2 flex justify-between items-center ${scrolled ? 'shadow-lg' : ''}`}>
                    <h1 className="text-lg font-bold tracking-tighter text-white">
                        {PORTFOLIO_DATA.personal.name.split(' ')[0]} <span className="gradient-text">{PORTFOLIO_DATA.personal.name.split(' ')[1] || 'Edit'}</span>
                    </h1>
                    <div className="hidden md:flex space-x-5 text-xs font-medium text-gray-300">
                        <a href="#work" className="hover:text-orange-400 transition-colors">Work</a>
                        <a href="#about" className="hover:text-orange-400 transition-colors">Contact</a>
                    </div>
                    <GradientBtn onClick={onContactClick} className="py-1.5 px-4 text-xs flex items-center gap-1.5">
                        <MessageCircle size={13} /> Contact Me
                    </GradientBtn>
                </div>
              </div>
            </nav>
          );
        };

        const AuroraBackground = () => (
          <div className="aurora-container">
            <div className="aurora-shape shape1" data-speed="0.2"></div>
            <div className="aurora-shape shape2" data-speed="0.5"></div>
            <div className="aurora-shape shape3" data-speed="0.35"></div>
            <div className="aurora-shape shape4" data-speed="0.6"></div>
          </div>
        );

        const Hero = () => (
            <section className="relative min-h-screen flex items-center justify-center pt-32 pb-20 px-6 animate-on-scroll overflow-hidden">
              <div className="absolute inset-0 bg-grid opacity-30 pointer-events-none z-0"></div>
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center max-w-7xl mx-auto w-full relative z-10">
                <div className="order-2 lg:order-1 space-y-8">
                  <div className="inline-flex items-center space-x-2 bg-white/5 border border-orange-500/30 px-4 py-1.5 rounded-full text-sm text-orange-300 backdrop-blur-sm shadow-[0_0_15px_rgba(249,115,22,0.2)]">
                    <span className="relative flex h-2 w-2">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-orange-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-orange-500"></span>
                    </span>
                    <span>Available for New Projects</span>
                  </div>
                  <h1 className="text-6xl md:text-8xl font-black text-white leading-[1.1] tracking-tighter drop-shadow-xl">
                    Elevating <br /><span className="gradient-text">Digital Stories</span>
                  </h1>
                  <p className="text-gray-400 text-lg md:text-xl max-w-lg leading-relaxed">{PORTFOLIO_DATA.personal.aboutText}</p>
                  <div className="flex flex-wrap gap-4 pt-4">
                      <a href="#work">
                          <GradientBtn className="py-3.5 px-8 text-base md:text-lg flex items-center gap-2">
                              <Play size={20} className="fill-white text-white" /> View My Work
                          </GradientBtn>
                      </a>
                      <a href="#about" className="py-3.5 px-8 text-base md:text-lg font-semibold text-white border border-white/20 rounded-full hover:bg-white/10 hover:border-orange-500/50 transition-all duration-300 flex items-center gap-2 backdrop-blur-sm">
                          <Mail size={20} /> Let's Talk
                      </a>
                  </div>
                </div>
                <div className="order-1 lg:order-2 flex justify-center relative perspective-1000">
                  <div className="relative animate-float">
                      <div className="absolute inset-0 bg-orange-500 rounded-full blur-[80px] opacity-20 -z-10 animate-pulse"></div>
                      <TiltCard>
                          <div className="relative w-80 h-[22rem] md:w-[26rem] md:h-[32rem] overflow-hidden rounded-xl border border-white/10">
                            <div className="absolute inset-0 bg-gradient-to-t from-[#0a0500] via-[#0a0500]/40 to-transparent z-10"></div>
                            <img src={PORTFOLIO_DATA.personal.profileImage} alt="Editor Profile" className="w-full h-full object-cover" />
                            <div className="absolute bottom-0 left-0 p-8 z-20 w-full">
                                <p className="text-orange-400 font-mono text-sm mb-1 uppercase tracking-wider">{PORTFOLIO_DATA.personal.title}</p>
                                <h3 className="text-white text-3xl font-bold">{PORTFOLIO_DATA.personal.name}</h3>
                                <div className="w-12 h-1 bg-gradient-to-r from-orange-500 to-red-500 mt-4 rounded-full"></div>
                            </div>
                          </div>
                      </TiltCard>
                  </div>
                </div>
              </div>
            </section>
        );

        const PUZZLE_CLASSES = [
            "md:col-start-1 md:col-span-3 md:row-start-1 md:row-span-2",
            "md:col-start-4 md:col-span-6 md:row-start-1 md:row-span-2",
            "md:col-start-10 md:col-span-3 md:row-start-1 md:row-span-3",
            "md:col-start-1 md:col-span-4 md:row-start-3 md:row-span-1",
            "md:col-start-5 md:col-span-5 md:row-start-3 md:row-span-1",
            "md:col-start-1 md:col-span-4 md:row-start-4 md:row-span-2",
            "md:col-start-5 md:col-span-4 md:row-start-4 md:row-span-2",
            "md:col-start-9 md:col-span-4 md:row-start-4 md:row-span-2",
        ];

        const PortfolioGallery = () => {
            const [filter, setFilter] = useState('All');
            const [playingVideo, setPlayingVideo] = useState(null);
            const filters = ['All', 'Podcasts', 'Motion', 'Shorts'];
            const filteredWorks = filter === 'All' ? PORTFOLIO_DATA.works : PORTFOLIO_DATA.works.filter(w => w.category === filter);
            const isAllFilter = filter === 'All';

            return (
                <section id="work" className="py-20 px-6 animate-on-scroll relative z-10">
                    <div className="max-w-[1400px] mx-auto w-full">
                        <div className="text-center mb-16">
                            <h2 className="text-sm font-bold tracking-widest text-orange-500 uppercase mb-2">Portfolio</h2>
                            <h3 className="text-4xl md:text-5xl font-black text-white mb-8">Selected <span className="gradient-text">Work</span></h3>
                            <div className="flex flex-wrap justify-center gap-3">
                                {filters.map(f => (
                                    <button key={f} onClick={() => { setFilter(f); setPlayingVideo(null); }}
                                        className={`px-6 py-2.5 rounded-full text-sm font-semibold transition-all duration-300 ${
                                            filter === f
                                            ? 'bg-gradient-to-r from-orange-500 to-red-500 text-white shadow-[0_0_20px_rgba(249,115,22,0.4)]'
                                            : 'bg-white/5 text-gray-400 hover:bg-white/10 hover:text-white border border-white/10'
                                        }`}>{f}</button>
                                ))}
                            </div>
                        </div>

                        <div className={isAllFilter ? "portfolio-grid" : "columns-1 sm:columns-2 lg:columns-3 gap-6 space-y-6"}>
                            {filteredWorks.map((work, index) => {
                                const isPlaying = playingVideo === work.id;
                                const gridClasses = isAllFilter ? (PUZZLE_CLASSES[index] || "") : "break-inside-avoid mb-6";

                                return (
                                    <div key={work.id} className={`${gridClasses} w-full h-full`}>
                                        {/*
                                          FIX 2 applied here:
                                          disabled={isPlaying} tells TiltCard to freeze all transforms
                                          so the iframe's GPU layer is never invalidated mid-playback.
                                        */}
                                        <TiltCard className="h-full w-full rounded-2xl" disabled={isPlaying}>
                                            <div
                                                className={`relative w-full h-full overflow-hidden bg-gray-900 rounded-2xl border border-white/5 shadow-lg ${isPlaying ? 'cursor-default' : 'cursor-pointer'} ${!isAllFilter ? (work.format === 'landscape' ? 'aspect-video' : 'aspect-[9/16]') : ''}`}
                                                onClick={() => !isPlaying && setPlayingVideo(work.id)}
                                            >
                                                {isPlaying ? (
                                                    <>
                                                        <iframe
                                                            src={getEmbedSrc(work.link)}
                                                            className="absolute inset-0 w-full h-full z-50 border-none"
                                                            title={work.title}
                                                            frameBorder="0"
                                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
                                                            allowFullScreen
                                                        ></iframe>
                                                        {/* Close button — stops the video and returns to thumbnail */}
                                                        <button
                                                            onClick={(e) => { e.stopPropagation(); setPlayingVideo(null); }}
                                                            className="absolute top-3 right-3 z-[60] bg-black/70 hover:bg-black text-white rounded-full p-1.5 transition-colors border border-white/20"
                                                            title="Close video"
                                                        >
                                                            <XIcon size={16} />
                                                        </button>
                                                    </>
                                                ) : (
                                                    <>
                                                        <img
                                                            src={work.image}
                                                            alt={work.title}
                                                            className="absolute inset-0 w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-transform duration-700 group-hover:scale-105"
                                                            onError={(e) => { e.target.src = 'https://via.placeholder.com/800x600/111/444?text=Preview+Not+Found'; }}
                                                        />
                                                        <div className="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent transition-opacity duration-300 group"></div>
                                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none group">
                                                            <div className="w-16 h-16 rounded-full bg-orange-500/80 backdrop-blur-md flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all transform scale-75 group-hover:scale-100 duration-300 shadow-[0_0_20px_rgba(249,115,22,0.5)] border border-orange-400">
                                                                <Play size={24} className="text-white fill-white ml-1" />
                                                            </div>
                                                        </div>
                                                        <div className="absolute bottom-0 left-0 p-5 w-full pointer-events-none">
                                                            <div className="text-orange-400 text-xs font-bold mb-2 flex items-center flex-wrap gap-2">
                                                                <span className="bg-orange-500/20 px-2 py-1 rounded text-orange-300 border border-orange-500/30">{work.category}</span>
                                                                {work.tags && work.tags[0] && (
                                                                    <span className="text-gray-300 flex items-center gap-1"><Layers size={10} /> {work.tags[0]}</span>
                                                                )}
                                                            </div>
                                                            <h4 className="text-white text-lg md:text-xl font-bold leading-tight mb-1 drop-shadow-lg">{work.title}</h4>
                                                            {work.client && <p className="text-gray-400 text-sm hidden sm:block">{work.client}</p>}
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        </TiltCard>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer id="about" className="border-t border-orange-500/20 mt-20 relative bg-[#0a0500]/95 backdrop-blur-xl overflow-hidden">
                <div className="absolute inset-0 bg-gradient-to-b from-transparent to-[#1a0b00] z-0"></div>
                <div className="container mx-auto px-6 py-24 relative z-10 max-w-4xl text-center">
                    <div className="animate-on-scroll">
                        <h2 className="text-4xl md:text-5xl font-black text-white mb-6 tracking-tight">Let's Create Something <span className="gradient-text">Amazing.</span></h2>
                        <p className="text-gray-400 text-lg leading-relaxed mb-10 max-w-2xl mx-auto">
                            Whether you need a dynamic podcast cut, high-retention shorts, or cinematic motion design, I'm ready to bring your vision to life.
                        </p>
                        <div className="flex flex-col items-center justify-center gap-6">
                            <a href={`mailto:${PORTFOLIO_DATA.personal.email}`}
                                className="inline-flex items-center gap-3 bg-gradient-to-r from-orange-600 to-red-600 text-white px-8 py-3.5 rounded-full font-bold text-lg hover:scale-105 hover:shadow-[0_0_25px_rgba(249,115,22,0.5)] transition-all duration-300">
                                <Mail size={22} /> Email Me Directly
                            </a>
                            <div className="flex gap-4">
                                <a href={PORTFOLIO_DATA.personal.socials.instagram} target="_blank" rel="noopener noreferrer" className="p-3 bg-white/5 rounded-full text-gray-400 hover:text-white hover:bg-gradient-to-tr hover:from-purple-500 hover:to-pink-500 transition-all border border-white/10 hover:border-transparent group">
                                    <Instagram size={20} className="group-hover:scale-110 transition-transform" />
                                </a>
                                <a href={PORTFOLIO_DATA.personal.socials.whatsapp} target="_blank" rel="noopener noreferrer" className="p-3 bg-white/5 rounded-full text-gray-400 hover:text-white hover:bg-green-500 transition-all border border-white/10 hover:border-transparent group">
                                    <Whatsapp size={20} className="group-hover:scale-110 transition-transform" />
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div className="container mx-auto px-6 py-8 border-t border-white/5 text-gray-500 text-sm flex flex-col md:flex-row justify-between items-center relative z-10">
                    <p>&copy; {new Date().getFullYear()} {PORTFOLIO_DATA.personal.name}. All rights reserved.</p>
                    <div className="flex space-x-6 mt-4 md:mt-0">
                        <span className="flex items-center text-gray-400"><Video size={14} className="mr-2"/> Video Editing</span>
                        <span className="flex items-center text-gray-400"><Scissors size={14} className="mr-2"/> Post Production</span>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
          useParallax();
          useOnScreen();
          const [isContactOpen, setIsContactOpen] = useState(false);
          return (
            <div className="relative overflow-x-hidden min-h-screen">
              <AuroraBackground />
              <Navbar onContactClick={() => setIsContactOpen(true)} />
              <main>
                <Hero />
                <PortfolioGallery />
              </main>
              <Footer />
              <ContactModal isOpen={isContactOpen} onClose={() => setIsContactOpen(false)} />
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
